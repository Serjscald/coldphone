<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coldphone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 15px;
            height: 100%;
        }
        .logo { font-size: 60px; }
        .app-name { font-size: 32px; font-weight: bold; color: #007AFF; }
        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-screen { display: none; flex-direction: column; height: 100%; }
        .header {
            background: #007AFF;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            word-wrap: break-word;
        }
        .received { background: #e9ecef; align-self: flex-start; }
        .sent { background: #007AFF; color: white; align-self: flex-end; }
        .sender { font-size: 12px; font-weight: bold; margin-bottom: 5px; opacity: 0.7; }
        .time { font-size: 10px; opacity: 0.6; margin-top: 5px; }
        .photo-message {
            max-width: 250px;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            margin: 5px 0;
        }
        .input-bar {
            display: flex;
            padding: 10px;
            gap: 8px;
            background: #f8f9fa;
            align-items: center;
        }
        .message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 20px;
            font-size: 16px;
            min-width: 0;
        }
        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #007AFF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        .attach-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #34C759;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        .file-input { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginScreen" class="login-screen">
            <div class="logo">❄️</div>
            <div class="app-name">Coldphone</div>
            <p style="color: #666;">Семейный мессенджер</p>
            <input type="text" id="usernameInput" class="input-field" placeholder="Ваше имя" maxlength="20">
            <input type="password" id="passwordInput" class="input-field" placeholder="Пароль">
            <button onclick="login()" class="btn">Войти в чат</button>
        </div>

        <div id="chatScreen" class="chat-screen">
            <div class="header">❄️ Coldphone</div>
            <div id="messagesContainer" class="messages"></div>
            <div class="input-bar">
                <button onclick="document.getElementById('photoInput').click()" class="attach-btn">📷</button>
                <input type="file" id="photoInput" class="file-input" accept="image/*" onchange="sendPhoto()">
                <input type="text" id="messageInput" class="message-input" placeholder="Сообщение...">
                <button onclick="sendMessage()" class="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        let username = '';
        let password = '';
        let pollingInterval = null;

        function login() {
            username = document.getElementById('usernameInput').value.trim();
            password = document.getElementById('passwordInput').value;
            
            if (!username) {
                alert('Введите ваше имя');
                return;
            }
            
            if (!password || password.length < 4) {
                alert('Введите пароль');
                return;
            }

            fetch('/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username, password: password})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'error') {
                    alert(data.message);
                    return;
                }
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
                
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(checkMessages, 1000);
                checkMessages();
            })
            .catch(error => {
                alert('Ошибка: ' + error);
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            fetch('/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sender: username,
                    type: 'text',
                    text: text,
                    timestamp: Date.now()
                })
            })
            .then(() => {
                input.value = '';
                checkMessages();
            });
        }

        function sendPhoto() {
            const fileInput = document.getElementById('photoInput');
            const file = fileInput.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1];
                
                fetch('/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        sender: username,
                        type: 'photo',
                        data: base64Data,
                        timestamp: Date.now()
                    })
                })
                .then(() => {
                    checkMessages();
                });
            };
            
            reader.readAsDataURL(file);
            fileInput.value = '';
        }

        function checkMessages() {
            fetch('/messages')
                .then(response => response.json())
                .then(data => {
                    displayMessages(data.messages);
                });
        }

        function displayMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            for (const msg of messages) {
                const div = document.createElement('div');
                div.className = 'message ' + (msg.sender === username ? 'sent' : 'received');
                
                const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', {
                    hour: '2-digit', minute: '2-digit'
                });
                
                let contentHTML = '';
                
                if (msg.type === 'photo') {
                    contentHTML = '<img src="data:image/jpeg;base64,' + msg.data + '" class="photo-message">';
                } else {
                    contentHTML = '<div>' + msg.text + '</div>';
                }
                
                div.innerHTML = (msg.sender !== username ? '<div class="sender">' + msg.sender + '</div>' : '') +
                    contentHTML +
                    '<div class="time">' + time + '</div>';
                
                container.appendChild(div);
            }
            
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
